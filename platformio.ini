[platformio]
src_dir = esp32
default_envs = LILIGO-ESP32

[env:LILIGO-ESP32]
platform = espressif32
board = lilygo-t-display
framework = arduino
; Un solo slot de app de 3MB en ve  de los dos de 1.25MB que reserva la tabla por
; defecto para OTA. Triplica el espacio de programa a costa de perder OTA.
board_build.partitions = huge_app.csv
lib_deps =
    knolleary/PubSubClient
    bodmer/TFT_eSPI@^2.5.43
; Config de TFT_eSPI por flags: asi no hay que editar User_Setup.h dentro de la
; libreria (se perderia en cada reinstalacion de dependencias).
; Equivale a Setup25_TTGO_T_Display.h. El panel es ST7789 por SPI, 135x240.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    ; bus SPI del panel
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTOUCH_CS=-1
    -DSPI_FREQUENCY=40000000
    ; backlight
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    ; fuentes: solo las que se usan (2 y 4). Las 6, 7, GFXFF y SMOOTH_FONT
    ; ocupan flash y no se dibuja nada con ellas.
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

monitor_speed = 115200
upload_speed = 921600
monitor_filters = direct, esp32_exception_decoder
